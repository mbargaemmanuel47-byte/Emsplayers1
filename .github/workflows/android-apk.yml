name: Android APK CI

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & install SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Erreur: sdkmanager introuvable dans $SDK_DIR" >&2
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" || true

          if [ ! -d "$SDK_DIR/platforms/android-36.1" ] && [ -d "$SDK_DIR/platforms/android-36" ]; then
            ln -sfn "$SDK_DIR/platforms/android-36" "$SDK_DIR/platforms/android-36.1"
          fi

      - name: Prepare .env & keystores
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json absent du dépôt GitHub : Firebase AI Logic sera désactivé dans cet APK."
          fi
          : > .env
          if [ -n "$GROQ_API_KEY" ]; then
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          rm -f /tmp/ci-upload.jks
          CI_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$CI_PASS"
          echo "CI_UPLOAD_PASS=$CI_PASS" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt \
            -keystore /tmp/ci-upload.jks \
            -storepass "$CI_PASS" \
            -alias upload \
            -keypass "$CI_PASS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=CI Upload,O=EmPlayer,C=CM"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK (reCAPTCHA App Check ready)
        env:
          KEYSTORE_PATH: /tmp/ci-upload.jks
          STORE_PASSWORD: ${{ env.CI_UPLOAD_PASS }}
          KEY_PASSWORD: ${{ env.CI_UPLOAD_PASS }}
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          rm -f /tmp/ci-upload.jks

      - name: Align, Sign (v1 + v2 with registered SHA-1) & Verify APK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT_DIR=$(ls -d "$SDK_DIR/build-tools"/* | sort -V | tail -n 1)
          "$BT_DIR/zipalign" -p -f 4 app/build/outputs/apk/release/app-release.apk app-aligned.apk
          "$BT_DIR/apksigner" sign \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out EmPlayer.apk \
            app-aligned.apk
          "$BT_DIR/apksigner" verify -v --min-sdk-version 21 EmPlayer.apk
          ls -lh EmPlayer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmPlayer-apk
          path: EmPlayer.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG="latest"
          RELEASE_ID=$(gh api "repos/$REPO/releases?per_page=30" --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null | head -n 1 || true)
          if [ -z "$RELEASE_ID" ]; then
            gh release create "$TAG" EmPlayer.apk \
              --target "${{ github.sha }}" \
              --title "Em Player APK" \
              --notes "APK Android Em Player (Release reCAPTCHA App Check, signé v1 + v2, compatible Android 6.0+ et partage Bluetooth/Xender)."
          else
            ASSET_IDS=$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == "EmPlayer.apk") | .id' 2>/dev/null || true)
            for AID in $ASSET_IDS; do
              gh api -X DELETE "repos/$REPO/releases/assets/$AID" || true
            done
            gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" -f target_commitish="${{ github.sha }}" -F draft=false >/dev/null 2>&1 || true
            gh release upload "$TAG" EmPlayer.apk --clobber
          fi
