name: Android APK CI

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & install SDK 36.1
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Erreur: sdkmanager introuvable dans $SDK_DIR" >&2
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "build-tools;36.0.0" "platforms;android-36"
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-36.1" || true

          if [ ! -d "$SDK_DIR/platforms/android-36.1" ] && [ -d "$SDK_DIR/platforms/android-36" ]; then
            ln -sfn "$SDK_DIR/platforms/android-36" "$SDK_DIR/platforms/android-36.1"
          fi

      - name: Prepare .env & debug keystore
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          : > .env
          if [ -n "$GROQ_API_KEY" ]; then
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> .env
          else
            echo "::warning::Secret GROQ_API_KEY absent de Settings > Secrets > Actions : le repli Groq ne sera pas actif dans cet APK."
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Align, Sign (v1 + v2) & Verify APK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT_DIR=$(ls -d "$SDK_DIR/build-tools"/* | sort -V | tail -n 1)
          "$BT_DIR/zipalign" -p -f 4 app/build/outputs/apk/debug/app-debug.apk app-aligned.apk
          "$BT_DIR/apksigner" sign \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out EmPlayer.apk \
            app-aligned.apk
          "$BT_DIR/apksigner" verify -v --min-sdk-version 21 EmPlayer.apk
          ls -lh EmPlayer.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmPlayer-apk
          path: EmPlayer.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest EmPlayer.apk --clobber
          else
            gh release create latest EmPlayer.apk \
              --title "Em Player APK" \
              --notes "APK Android Em Player (signé v1 + v2, compatible Android 6.0+)."
          fi
